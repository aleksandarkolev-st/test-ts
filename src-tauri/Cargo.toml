[package]
name = "meeting-copilot"
version = "0.2.2"
description = "A local Windows meeting copilot"
edition = "2021"
license = "MIT"

[lib]
name = "meeting_copilot_core"
crate-type = ["rlib"]

[features]
acceptance = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full", "test-util"] }
tokio-util = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
tokio-tungstenite = "0.28"
uuid = { version = "1", features = ["v4", "serde"] }
rusqlite = { version = "0.37", features = ["bundled"] }
base64 = "0.22"
ignore = "0.4"
png = "0.17"
sha2 = "0.10"
rand = "0.8"
jsonwebtoken = "9"
url = "2"
whisper-rs = { version = "0.15", features = ["raw-api"] }
whisper-rs-sys = "0.14.1"
webbrowser = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Media_Audio", "Win32_Media_KernelStreaming", "Win32_Media_Multimedia", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Security_Credentials", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Power"] }

[patch.crates-io]
whisper-rs-sys = { path = "../vendor/whisper-rs-sys" }
